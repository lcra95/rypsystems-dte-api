# Desarrollo local: PostgreSQL + API + worker.
#   cp .env.example .env   (y completar las claves)
#   docker compose up --build
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: dte
      POSTGRES_PASSWORD: dte
      POSTGRES_DB: dte
    volumes: [dte-db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dte"]
      interval: 5s
      retries: 10

  api:
    build: &build
      context: .
      additional_contexts:
        core: ../rypsystems-dte
    env_file: .env
    environment: &db
      DTE_DATABASE_URL: postgresql+psycopg://dte:dte@db:5432/dte
    command: sh -c "alembic upgrade head && uvicorn app.main:create_app --factory --host 0.0.0.0 --port 8000"
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      db: {condition: service_healthy}

  worker:
    build: *build
    env_file: .env
    environment: *db
    command: python -m app.worker
    depends_on:
      db: {condition: service_healthy}
      api: {condition: service_started}

volumes:
  dte-db:

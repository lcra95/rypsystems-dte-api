name: tests
on: [push, pull_request]
jobs:
  pytest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dte
          POSTGRES_PASSWORD: dte
          POSTGRES_DB: dte_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dte" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[test]"
      - name: SQLite
        run: pytest -q
      - name: PostgreSQL (incluye la prueba de concurrencia)
        run: pytest -q
        env:
          DTE_TEST_DATABASE_URL: postgresql+psycopg://dte:dte@localhost:5432/dte_test
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t rypsystems-dte-api .
      - name: Compose de producción válido
        working-directory: deploy
        run: |
          printf 'DTE_DOMINIO=localhost\nACME_EMAIL=ci@example.com\nPOSTGRES_PASSWORD=ci\n' > .env
          docker compose -f compose.prod.yml config --quiet
          docker compose -f compose.prod.yml build respaldo
          sh -n respaldo/respaldar.sh && sh -n respaldo/restaurar.sh && sh -n desplegar.sh && sh -n generar-secretos.sh && sh -n preparar-servidor.sh

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rypsystems-dte-api"
version = "0.1.0"
description = "Servicio DTE de RYP: API REST interna de facturación electrónica (SII de Chile)"
license = {text = "AGPL-3.0-or-later"}
authors = [{name = "RYP AI SYSTEMS SPA"}]
requires-python = ">=3.10"
dependencies = [
    # En producción, fijar el tag del core: rypsystems-dte @ git+ssh://...@v0.1.0
    "rypsystems-dte>=0.3.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "python-multipart>=0.0.9",
    "requests>=2.31",
    "cryptography>=41",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools]
license-files = ["COPYING", "NOTICE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:fastapi.testclient", "ignore:Using `httpx`"]
